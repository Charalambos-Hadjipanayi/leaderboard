<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Radar-Pong Leaderboard – GERF 2026</title>
  <style>
    /* ── Theme variables ──────────────────────────────────────────────────── */
    :root {
      --bg:          #001228;
      --bg-panel:    #002147;
      --bg-input:    #00101f;
      --border:      #003a6b;
      --border-soft: #001c3d;
      --text:        #c5ddef;
      --text-muted:  #2d5a7e;
      --text-faint:  #1e3a5f;
      --accent:      #4e95bf;
      --score:       #71bfdf;
      --title:       #4e95bf;
      --h1-from:     #7ec8e3;
      --h1-to:       #c5ddef;
      --btn-from:    #003E74;
      --btn-to:      #4e95bf;
      --btn-text:    #ffffff;
      --row-hover:   #002147;
      --overlay:     rgba(0,0,0,0.75);
      --danger:      #c0392b;
    }

    html[data-bw] {
      --bg:          #ffffff;
      --bg-panel:    #f0f0f0;
      --bg-input:    #ffffff;
      --border:      #888888;
      --border-soft: #cccccc;
      --text:        #000000;
      --text-muted:  #444444;
      --text-faint:  #888888;
      --accent:      #000000;
      --score:       #000000;
      --title:       #111111;
      --h1-from:     #000000;
      --h1-to:       #000000;
      --btn-from:    #111111;
      --btn-to:      #444444;
      --btn-text:    #ffffff;
      --row-hover:   #eeeeee;
      --overlay:     rgba(0,0,0,0.6);
      --danger:      #000000;
    }

    /* ── Base ─────────────────────────────────────────────────────────────── */
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding-bottom: 4rem;
      transition: background 0.2s, color 0.2s;
    }

    /* ── Header ───────────────────────────────────────────────────────────── */
    header {
      width: 100%;
      max-width: 680px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 2rem 1.25rem 1.25rem;
    }

    #eventTitle {
      font-size: 0.8rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      color: var(--title);
      margin-bottom: 0.3rem;
    }

    h1 {
      font-size: 2rem;
      font-weight: 800;
      background: linear-gradient(135deg, var(--h1-from), var(--h1-to));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      letter-spacing: -0.5px;
    }

    html[data-bw] h1 {
      background: none;
      -webkit-text-fill-color: var(--text);
      color: var(--text);
    }

    .header-actions { display: flex; gap: 0.5rem; align-items: center; }

    .icon-btn {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text-muted);
      width: 2.1rem;
      height: 2.1rem;
      border-radius: 7px;
      cursor: pointer;
      font-size: 1rem;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: border-color 0.2s, color 0.2s;
    }
    .icon-btn:hover                { border-color: var(--accent); color: var(--accent); }
    .icon-btn[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); }

    #adminBtn {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text-muted);
      padding: 0.4rem 1rem;
      border-radius: 7px;
      cursor: pointer;
      font-size: 0.82rem;
      transition: border-color 0.2s, color 0.2s;
      letter-spacing: 0.5px;
    }
    #adminBtn:hover     { border-color: var(--accent); color: var(--accent); }
    #adminBtn.logged-in { border-color: var(--accent); color: var(--accent); font-weight: 600; }

    /* ── Main ─────────────────────────────────────────────────────────────── */
    main { width: 100%; max-width: 680px; padding: 0 1.25rem; }

    /* ── Admin panel ──────────────────────────────────────────────────────── */
    #adminPanel {
      display: none;
      background: var(--bg-panel);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1.25rem;
      margin-bottom: 1.5rem;
    }

    #adminPanel label {
      font-size: 0.72rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--accent);
      display: block;
      margin-bottom: 0.75rem;
      font-weight: 700;
    }

    #addForm { display: flex; gap: 0.6rem; flex-wrap: wrap; }

    #addForm input {
      background: var(--bg-input);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 0.6rem 0.85rem;
      border-radius: 8px;
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.2s;
    }
    #addForm input:focus { border-color: var(--accent); }
    #nameInput  { flex: 2; min-width: 140px; }
    #scoreInput { flex: 1; min-width: 90px; }

    #addForm button[type=submit] {
      background: linear-gradient(135deg, var(--btn-from), var(--btn-to));
      border: none;
      color: var(--btn-text);
      font-weight: 700;
      padding: 0.6rem 1.2rem;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.95rem;
      white-space: nowrap;
      transition: opacity 0.2s;
    }
    #addForm button[type=submit]:hover { opacity: 0.82; }

    /* ── Stats bar ────────────────────────────────────────────────────────── */
    #statsBar {
      display: flex;
      gap: 0.75rem;
      margin-bottom: 1.25rem;
      flex-wrap: wrap;
    }

    .stat {
      flex: 1;
      min-width: 130px;
      background: var(--bg-panel);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 0.75rem 1rem;
      display: flex;
      flex-direction: column;
      gap: 0.25rem;
    }

    .stat-label {
      font-size: 0.68rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--text-muted);
      font-weight: 700;
    }

    .stat-value {
      font-size: 1.1rem;
      font-weight: 700;
      color: var(--text);
    }

    /* ── Find bar ─────────────────────────────────────────────────────────── */
    #findBar {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      margin-bottom: 0.5rem;
      background: var(--bg-panel);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 0.5rem 0.85rem;
      transition: border-color 0.2s;
    }
    #findBar:focus-within { border-color: var(--accent); }

    #findIcon { font-size: 0.95rem; opacity: 0.5; flex-shrink: 0; }

    #findInput {
      flex: 1;
      background: transparent;
      border: none;
      color: var(--text);
      font-size: 0.93rem;
      outline: none;
      min-width: 0;
    }
    #findInput::placeholder { color: var(--text-muted); }
    #findInput::-webkit-search-cancel-button { display: none; }

    #findClear {
      background: transparent;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      font-size: 1.1rem;
      line-height: 1;
      padding: 0 0.1rem;
      transition: color 0.15s;
      visibility: hidden;
    }
    #findClear:hover { color: var(--text); }
    #findClear.visible { visibility: visible; }

    #findResult {
      font-size: 0.82rem;
      color: var(--text-muted);
      min-height: 1.4rem;
      padding: 0 0.25rem 0.5rem;
    }

    /* ── Leaderboard table ────────────────────────────────────────────────── */
    .board { width: 100%; border-collapse: collapse; }

    .board thead tr { border-bottom: 2px solid var(--border); }

    .board th {
      padding: 0.65rem 1rem;
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--text-muted);
      text-align: left;
      font-weight: 700;
    }
    .board th.right { text-align: right; }

    .board tbody tr {
      border-bottom: 1px solid var(--border-soft);
      transition: background 0.15s, opacity 0.2s;
      animation: fadeIn 0.25s ease;
    }
    .board tbody tr:hover { background: var(--row-hover); }

    .board tbody tr.dimmed { opacity: 0.15; }
    .board tbody tr.found  {
      background: var(--row-hover);
      outline: 2px solid var(--accent);
      outline-offset: -1px;
    }
    html[data-bw] .board tbody tr.found { outline-style: dashed; }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-4px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .board td { padding: 0.9rem 1rem; font-size: 0.97rem; }

    td.rank {
      width: 80px;
      font-weight: 700;
      color: var(--text-muted);
      font-size: 0.9rem;
    }
    td.rank.gold   { font-size: 1.3rem; }
    td.rank.silver { font-size: 1.15rem; }
    td.rank.bronze { font-size: 1.1rem; }

    td.player { font-weight: 600; }

    td.score {
      text-align: right;
      font-variant-numeric: tabular-nums;
      font-weight: 700;
      font-size: 1.05rem;
      color: var(--score);
    }
    html[data-bw] td.score { text-decoration: underline; text-decoration-style: dotted; }

    td.action { width: 80px; text-align: right; }

    .remove-btn {
      display: none;
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text-muted);
      padding: 0.22rem 0.55rem;
      border-radius: 5px;
      cursor: pointer;
      font-size: 0.78rem;
      transition: border-color 0.15s, color 0.15s;
    }
    .remove-btn:hover { border-color: var(--danger); color: var(--danger); text-decoration: underline; }
    html[data-bw] .remove-btn:hover { font-weight: 700; }
    .remove-btn.show { display: inline-block; }

    /* ── Empty state ──────────────────────────────────────────────────────── */
    #emptyState {
      text-align: center;
      color: var(--text-faint);
      padding: 3.5rem 1rem;
      font-size: 1rem;
    }

    /* ── Reset section ────────────────────────────────────────────────────── */
    #resetSection {
      display: none;
      margin-top: 3rem;
      padding-top: 1.5rem;
      border-top: 1px solid var(--border-soft);
      text-align: center;
    }

    #resetSection p {
      font-size: 0.75rem;
      color: var(--text-faint);
      margin-bottom: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    #resetBtn {
      background: transparent;
      border: 1px solid var(--danger);
      color: var(--danger);
      padding: 0.5rem 1.6rem;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.85rem;
      font-weight: 600;
      transition: background 0.2s, color 0.2s;
    }
    #resetBtn:hover { background: var(--danger); color: #ffffff; }

    /* ── Live bar ─────────────────────────────────────────────────────────── */
    .live-bar {
      width: 100%;
      max-width: 680px;
      padding: 0.5rem 1.25rem 0;
      font-size: 0.72rem;
      color: var(--text-faint);
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 0.4rem;
    }
    .dot {
      width: 7px; height: 7px;
      border-radius: 50%;
      background: #4caf50;
      animation: pulse 2s infinite;
    }
    html[data-bw] .dot { background: #000; }

    @keyframes pulse {
      0%,100% { opacity: 1; }
      50%      { opacity: 0.25; }
    }

    /* ── Login modal ──────────────────────────────────────────────────────── */
    #loginOverlay {
      display: none;
      position: fixed;
      inset: 0;
      background: var(--overlay);
      z-index: 200;
      align-items: center;
      justify-content: center;
    }
    #loginOverlay.open { display: flex; }

    #loginBox {
      background: var(--bg-panel);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 2rem;
      width: 310px;
      max-width: 92vw;
    }
    #loginBox h2 { font-size: 1rem; color: var(--accent); margin-bottom: 1.1rem; font-weight: 700; }

    #loginForm { display: flex; flex-direction: column; gap: 0.65rem; }

    #loginForm input {
      background: var(--bg-input);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 0.65rem 0.85rem;
      border-radius: 8px;
      font-size: 0.93rem;
      outline: none;
    }
    #loginForm input:focus { border-color: var(--accent); }

    #loginSubmit {
      background: linear-gradient(135deg, var(--btn-from), var(--btn-to));
      border: none;
      color: var(--btn-text);
      font-weight: 700;
      padding: 0.65rem;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.95rem;
      margin-top: 0.15rem;
      transition: opacity 0.2s;
    }
    #loginSubmit:hover { opacity: 0.82; }

    #loginError {
      color: var(--danger);
      font-size: 0.82rem;
      display: none;
      text-align: center;
      font-weight: 600;
    }
    html[data-bw] #loginError { text-decoration: underline; }

    #cancelLogin {
      background: transparent;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      font-size: 0.82rem;
      text-align: center;
      padding: 0.25rem;
      transition: color 0.15s;
    }
    #cancelLogin:hover { color: var(--accent); text-decoration: underline; }
  </style>
</head>
<body>

  <header>
    <div>
      <p id="eventTitle">Radar-Pong Game &mdash; GERF 2026</p>
      <h1>&#127942; Leaderboard</h1>
    </div>
    <div class="header-actions">
      <button class="icon-btn" id="bwBtn" aria-pressed="false" title="Toggle black &amp; white mode">&#9680;</button>
      <button id="adminBtn" aria-label="Admin login">Admin</button>
    </div>
  </header>

  <div class="live-bar">
    <span class="dot" aria-hidden="true"></span> Live
  </div>

  <main>

    <!-- Admin add-entry panel -->
    <div id="adminPanel" role="region" aria-label="Add leaderboard entry">
      <label>&#10003; Admin &mdash; Add Entry</label>
      <form id="addForm" autocomplete="off">
        <input type="text"   id="nameInput"  placeholder="Name / Nickname" required aria-label="Player name">
        <input type="number" id="scoreInput" placeholder="Score" required min="0" step="1" aria-label="Score">
        <button type="submit">+ Add</button>
      </form>
    </div>

    <!-- Stats strip -->
    <div id="statsBar" aria-label="Leaderboard statistics">
      <div class="stat">
        <span class="stat-label">Date</span>
        <span class="stat-value" id="statDate">&mdash;</span>
      </div>
      <div class="stat">
        <span class="stat-label">Highest Score</span>
        <span class="stat-value" id="statTop">&mdash;</span>
      </div>
      <div class="stat">
        <span class="stat-label">Players</span>
        <span class="stat-value" id="statCount">0</span>
      </div>
    </div>

    <!-- Find bar (all users) -->
    <div id="findBar" role="search">
      <span id="findIcon" aria-hidden="true">&#128269;</span>
      <input type="search" id="findInput" placeholder="Find your name on the board&hellip;" aria-label="Search players">
      <button id="findClear" aria-label="Clear search">&#215;</button>
    </div>
    <p id="findResult" role="status" aria-live="polite"></p>

    <!-- Leaderboard table -->
    <table class="board" aria-label="Leaderboard">
      <thead>
        <tr>
          <th scope="col">Ranking</th>
          <th scope="col">Player</th>
          <th scope="col" class="right">Score</th>
          <th scope="col"><span class="sr-only">Actions</span></th>
        </tr>
      </thead>
      <tbody id="tbody"></tbody>
    </table>

    <div id="emptyState" role="status">No entries yet.</div>

    <!-- Reset section (admin only) -->
    <div id="resetSection">
      <p>Danger Zone</p>
      <button id="resetBtn">&#9888; Reset Leaderboard</button>
    </div>

  </main>

  <!-- Login overlay -->
  <div id="loginOverlay" role="dialog" aria-modal="true" aria-labelledby="loginHeading">
    <div id="loginBox">
      <h2 id="loginHeading">Admin Login</h2>
      <form id="loginForm" autocomplete="off">
        <input type="text"     id="usernameInput" placeholder="Username" autocomplete="username" aria-label="Username">
        <input type="password" id="passwordInput" placeholder="Password" aria-label="Password">
        <span id="loginError" role="alert">Incorrect credentials &mdash; try again.</span>
        <button type="submit" id="loginSubmit">Sign In</button>
        <button type="button" id="cancelLogin">Cancel</button>
      </form>
    </div>
  </div>

  <!-- Firebase SDK (modular v10) -->
  <script type="module">
    import { initializeApp }
      from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import { getDatabase, ref, push, remove, onValue }
      from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";
    import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged }
      from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

    const firebaseConfig = {
      apiKey:            "AIzaSyB5__FOLI5rG_3auAhwDOCdqeP0_pNywKE",
      authDomain:        "game-leaderboard-61160.firebaseapp.com",
      databaseURL:       "https://game-leaderboard-61160-default-rtdb.europe-west1.firebasedatabase.app",
      projectId:         "game-leaderboard-61160",
      storageBucket:     "game-leaderboard-61160.firebasestorage.app",
      messagingSenderId: "579397977835",
      appId:             "1:579397977835:web:c4abc9082e79f1697de0ae",
    };

    const app  = initializeApp(firebaseConfig);
    const db   = getDatabase(app);
    const auth = getAuth(app);

    const MEDALS = ['🥇','🥈','🥉'];
    let liveData = {};

    // Returns next available suffixed name (used after admin confirms append)
    function nextSuffixedName(base, data) {
      const names = Object.values(data).map(v => v.name);
      let n = 2;
      while (names.includes(`${base} (${n})`)) n++;
      return `${base} (${n})`;
    }

    // DOM refs
    const tbody        = document.getElementById('tbody');
    const emptyState   = document.getElementById('emptyState');
    const adminPanel   = document.getElementById('adminPanel');
    const adminBtn     = document.getElementById('adminBtn');
    const loginOverlay = document.getElementById('loginOverlay');
    const loginForm    = document.getElementById('loginForm');
    const loginError   = document.getElementById('loginError');
    const addForm      = document.getElementById('addForm');
    const nameInput    = document.getElementById('nameInput');
    const scoreInput   = document.getElementById('scoreInput');
    const bwBtn        = document.getElementById('bwBtn');
    const findInput    = document.getElementById('findInput');
    const findClear    = document.getElementById('findClear');
    const findResult   = document.getElementById('findResult');
    const statDate     = document.getElementById('statDate');
    const statTop      = document.getElementById('statTop');
    const statCount    = document.getElementById('statCount');
    const resetSection = document.getElementById('resetSection');
    const resetBtn     = document.getElementById('resetBtn');

    // ── B/W mode ─────────────────────────────────────────────────────────
    const BW_KEY = 'lb-bw';
    function applyBW(on) {
      document.documentElement.toggleAttribute('data-bw', on);
      bwBtn.setAttribute('aria-pressed', String(on));
      localStorage.setItem(BW_KEY, on ? '1' : '');
    }
    applyBW(!!localStorage.getItem(BW_KEY));
    bwBtn.addEventListener('click', () =>
      applyBW(!document.documentElement.hasAttribute('data-bw'))
    );

    // ── Date (set once) ───────────────────────────────────────────────────
    statDate.textContent = new Date().toLocaleDateString('en-GB', {
      weekday: 'short', day: '2-digit', month: 'long', year: 'numeric'
    });

    // ── Live leaderboard ─────────────────────────────────────────────────
    onValue(ref(db, 'leaderboard'), snapshot => {
      liveData      = snapshot.val() || {};
      const entries = Object.entries(liveData)
        .map(([id, v]) => ({ id, name: v.name, score: Number(v.score) }))
        .sort((a, b) => b.score - a.score || a.name.localeCompare(b.name));

      // Update stats
      statCount.textContent = entries.length;
      statTop.textContent   = entries.length > 0 ? entries[0].score.toLocaleString() : '—';

      tbody.innerHTML = '';
      emptyState.style.display = entries.length ? 'none' : 'block';

      const isAdmin = !!auth.currentUser;

      entries.forEach(({ id, name, score }, i) => {
        const rank      = i + 1;
        const rankClass = rank === 1 ? 'gold' : rank === 2 ? 'silver' : rank === 3 ? 'bronze' : '';
        const rankLabel = rank <= 3 ? MEDALS[i] : `#${rank}`;

        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td class="rank ${rankClass}" aria-label="Rank ${rank}">${rankLabel}</td>
          <td class="player">${esc(name)}</td>
          <td class="score">${score.toLocaleString()}</td>
          <td class="action">
            <button class="remove-btn ${isAdmin ? 'show' : ''}" data-id="${esc(id)}" aria-label="Remove ${esc(name)}">Remove</button>
          </td>`;
        tbody.appendChild(tr);
      });

      tbody.querySelectorAll('.remove-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          const playerName = btn.getAttribute('aria-label').replace('Remove ', '');
          if (confirm(`Remove "${playerName}" from the leaderboard?`)) {
            remove(ref(db, `leaderboard/${btn.dataset.id}`));
          }
        });
      });

      // Re-apply any active search after board re-render
      applySearch();
    });

    // ── Add entry ────────────────────────────────────────────────────────
    addForm.addEventListener('submit', e => {
      e.preventDefault();
      const rawName = nameInput.value.trim();
      const score   = parseInt(scoreInput.value, 10);
      if (!rawName || isNaN(score)) return;

      // Case-insensitive duplicate check
      const existingNames = Object.values(liveData).map(v => v.name.toLowerCase());
      if (existingNames.includes(rawName.toLowerCase())) {
        const suggested = nextSuffixedName(rawName, liveData);
        const append = confirm(
          `A player named "${rawName}" already exists.\n\n` +
          `• OK  →  add as "${suggested}" (played again)\n` +
          `• Cancel  →  go back and enter a different name`
        );
        if (!append) {
          nameInput.select();
          nameInput.focus();
          return;
        }
        push(ref(db, 'leaderboard'), { name: suggested, score });
      } else {
        push(ref(db, 'leaderboard'), { name: rawName, score });
      }

      nameInput.value  = '';
      scoreInput.value = '';
      nameInput.focus();
    });

    // ── Find bar ─────────────────────────────────────────────────────────
    function applySearch() {
      const q = findInput.value.trim().toLowerCase();
      findClear.classList.toggle('visible', q.length > 0);

      const rows = Array.from(tbody.querySelectorAll('tr'));
      if (!q) {
        findResult.textContent = '';
        rows.forEach(r => r.classList.remove('dimmed', 'found'));
        return;
      }

      let found = 0;
      rows.forEach(r => {
        const name = r.querySelector('.player')?.textContent.toLowerCase() || '';
        const match = name.includes(q);
        r.classList.toggle('dimmed', !match);
        r.classList.toggle('found',  match);
        if (match) found++;
      });

      if (rows.length === 0) {
        findResult.textContent = '';
      } else if (found === 0) {
        findResult.textContent = 'No player found with that name.';
      } else {
        findResult.textContent = found === 1 ? 'Player found.' : `${found} players found.`;
        document.querySelector('#tbody tr.found')?.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
      }
    }

    findInput.addEventListener('input', applySearch);

    findClear.addEventListener('click', () => {
      findInput.value = '';
      applySearch();
      findInput.focus();
    });

    // ── Auth state ───────────────────────────────────────────────────────
    onAuthStateChanged(auth, user => {
      const on = !!user;
      adminPanel.style.display  = on ? 'block'  : 'none';
      resetSection.style.display = on ? 'block' : 'none';
      adminBtn.textContent      = on ? 'Logout' : 'Admin';
      adminBtn.classList.toggle('logged-in', on);
      document.querySelectorAll('.remove-btn')
        .forEach(b => b.classList.toggle('show', on));
    });

    // ── Admin button ─────────────────────────────────────────────────────
    adminBtn.addEventListener('click', () => {
      if (auth.currentUser) {
        signOut(auth);
      } else {
        loginOverlay.classList.add('open');
        document.getElementById('usernameInput').focus();
      }
    });

    // ── Login ────────────────────────────────────────────────────────────
    loginForm.addEventListener('submit', async e => {
      e.preventDefault();
      loginError.style.display = 'none';
      try {
        const username = document.getElementById('usernameInput').value.trim().toLowerCase();
        await signInWithEmailAndPassword(
          auth,
          `${username}@leaderboard.app`,
          document.getElementById('passwordInput').value
        );
        loginOverlay.classList.remove('open');
        loginForm.reset();
      } catch {
        loginError.style.display = 'block';
      }
    });

    document.getElementById('cancelLogin').addEventListener('click', () => {
      loginOverlay.classList.remove('open');
      loginForm.reset();
      loginError.style.display = 'none';
    });

    // ── Reset leaderboard (admin only, double-confirmed) ──────────────────
    resetBtn.addEventListener('click', () => {
      if (!confirm(
        'Are you sure you want to reset the leaderboard?\n' +
        'This will permanently delete ALL entries.'
      )) return;
      if (!confirm(
        'Second confirmation — this cannot be undone.\n\n' +
        'Reset the leaderboard now?'
      )) return;
      remove(ref(db, 'leaderboard'));
    });

    // ── Util ─────────────────────────────────────────────────────────────
    function esc(s) {
      return String(s).replace(/[&<>"']/g, c =>
        ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
    }
  </script>

</body>
</html>
